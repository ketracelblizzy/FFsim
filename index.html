<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Retro CRPG - Black Hack Combat</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .game-container {
      width: 100%;
      max-width: 680px;
      background: linear-gradient(180deg, #000080 0%, #000033 100%);
      border: 4px solid #ffffff;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2), inset 0 0 10px rgba(0, 0, 0, 0.8);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Monster Visual Area */
    .screen {
      background-color: #000;
      border: 3px solid #666;
      border-radius: 4px;
      height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .monster-sprite {
      font-size: 56px;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    .monster-info {
      text-align: center;
      font-size: 11px;
    }

    .health-bar-container {
      width: 160px;
      height: 12px;
      background-color: #444;
      border: 1px solid #fff;
      margin-top: 6px;
    }

    .health-bar {
      height: 100%;
      background-color: #e74c3c;
      width: 100%;
      transition: width 0.3s ease;
    }

    /* Message Log */
    .log-box {
      background: #000022;
      border: 2px solid #ffffff;
      border-radius: 4px;
      height: 100px;
      padding: 10px;
      font-size: 9px;
      line-height: 1.6;
      overflow-y: auto;
      color: #e0e0e0;
    }

    /* Player Status & Command Grid */
    .bottom-panel {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 12px;
    }

    .panel-box {
      background: #000055;
      border: 2px solid #ffffff;
      border-radius: 4px;
      padding: 10px;
      font-size: 9px;
      line-height: 1.7;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px 8px;
      margin-top: 4px;
      margin-bottom: 6px;
      color: #f1c40f;
    }

    .menu-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      text-align: left;
      cursor: pointer;
      padding: 4px;
      transition: color 0.1s;
    }

    button:hover {
      color: #f1c40f;
    }

    button:before {
      content: '▶ ';
      opacity: 0;
    }

    button:hover:before {
      opacity: 1;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- Monster Display -->
    <div class="screen">
      <div id="monster-sprite" class="monster-sprite">👾</div>
      <div class="monster-info">
        <div id="monster-name">MONSTER</div>
        <div class="health-bar-container">
          <div id="monster-hp-bar" class="health-bar"></div>
        </div>
      </div>
    </div>

    <!-- Battle Log -->
    <div id="log" class="log-box">Rolling stats and entering dungeon...</div>

    <!-- Stats and Actions -->
    <div class="bottom-panel">
      <!-- Player Stats -->
      <div class="panel-box">
        <div style="color: #64b5f6; font-weight: bold;">HERO</div>
        <div id="player-weapon" style="color: #aaa;">Equipped: -</div>
        <div class="stats-grid">
          <div>STR: <span id="stat-str">0</span></div>
          <div>DEX: <span id="stat-dex">0</span></div>
          <div>CON: <span id="stat-con">0</span></div>
          <div>WIS: <span id="stat-wis">0</span></div>
        </div>
        <div>HP: <span id="player-hp">0</span>/<span id="player-max-hp">0</span></div>
        <div>MP: <span id="player-mp">0</span>/<span id="player-max-mp">0</span></div>
      </div>

      <!-- Action Submenus -->
      <div class="panel-box">
        <!-- Root Menu -->
        <div id="main-menu" class="menu-options">
          <button onclick="handleFight()">Fight</button>
          <button onclick="showMenu('magic-menu')">Magic</button>
          <button onclick="showMenu('item-menu')">Item</button>
        </div>

        <!-- Magic Submenu -->
        <div id="magic-menu" class="menu-options hidden">
          <div id="magic-buttons"></div>
          <button onclick="showMenu('main-menu')" style="color: #888;">Back</button>
        </div>

        <!-- Item Submenu -->
        <div id="item-menu" class="menu-options hidden">
          <button onclick="useItem('potion')">Potion (<span id="count-potion">1</span>)</button>
          <button onclick="useItem('fire')">Alch Fire (<span id="count-fire">1</span>)</button>
          <button onclick="useItem('dummy')">Dummy (<span id="count-dummy">1</span>)</button>
          <button onclick="showMenu('main-menu')" style="color: #888;">Back</button>
        </div>

        <!-- Reset Button (When battle ends) -->
        <div id="reset-menu" class="menu-options hidden">
          <button onclick="initGame()">New Encounter</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- UTILITIES ---
    const roll3d6 = () => Math.floor(Math.random() * 6 + 1) + Math.floor(Math.random() * 6 + 1) + Math.floor(Math.random() * 6 + 1);
    const rollD20 = () => Math.floor(Math.random() * 20) + 1;
    const rollD8 = () => Math.floor(Math.random() * 8) + 1;

    // --- GAME DATA ---
    const MONSTERS = [
      { name: "Goblin", level: 1, hp: 35, maxHp: 35, sprite: "👺", log: "A sneaky Goblin (Lvl 1) darts forward!" },
      { name: "Skeleton", level: 2, hp: 55, maxHp: 55, sprite: "💀", log: "A Skeleton (Lvl 2) rattles its bones!" },
      { name: "Slime", level: 3, hp: 75, maxHp: 75, sprite: "🟢", log: "A corrosive Slime (Lvl 3) blocks the path!" },
      { name: "Minotaur", level: 4, hp: 110, maxHp: 110, sprite: "🐂", log: "A terrifying Minotaur (Lvl 4) bellows!" }
    ];

    const WEAPONS = ["Sword", "Spear", "Axe", "Bow"];

    const ALL_SPELLS = [
      { id: "fireball", name: "Fireball", cost: 8 },
      { id: "frost", name: "Frost", cost: 5 },
      { id: "bolt", name: "Bolt", cost: 10 },
      { id: "grass", name: "Grass Cutter", cost: 6 }
    ];

    // State
    let player, monster, isPlayerTurn;

    function initGame() {
      // 1. Roll Player Stats (3d6)
      const str = roll3d6();
      const dex = roll3d6();
      const con = roll3d6();
      const wis = roll3d6();

      // HP = CON * 10 (+50 bonus HP if CON > 12)
      let maxHp = con * 10;
      if (con > 12) {
        maxHp += 50;
      }

      // 12+ WIS required for 1 random spell
      let learnedSpell = null;
      if (wis >= 12) {
        learnedSpell = ALL_SPELLS[Math.floor(Math.random() * ALL_SPELLS.length)];
      }

      player = {
        str, dex, con, wis,
        hp: maxHp,
        maxHp: maxHp,
        mp: wis * 2,
        maxMp: wis * 2,
        weapon: WEAPONS[Math.floor(Math.random() * WEAPONS.length)],
        spell: learnedSpell,
        items: { potion: 1, fire: 1, dummy: 1 }
      };

      // 2. Randomize Encounter
      const template = MONSTERS[Math.floor(Math.random() * MONSTERS.length)];
      monster = { ...template };

      isPlayerTurn = true;

      // 3. Render UI & Log
      document.getElementById("log").innerText = `Hero created! (WIS: ${player.wis})\n` + monster.log;
      document.getElementById("player-weapon").innerText = `Weapon: ${player.weapon}`;

      renderMagicMenu();
      showMenu('main-menu');
      updateUI();
    }

    function renderMagicMenu() {
      const container = document.getElementById("magic-buttons");
      container.innerHTML = "";

      if (player.spell) {
        const btn = document.createElement("button");
        btn.innerText = `${player.spell.name} (${player.spell.cost}MP)`;
        btn.onclick = () => castSpell(player.spell);
        container.appendChild(btn);
      } else {
        const div = document.createElement("div");
        div.style.color = "#888";
        div.innerText = "No Spells (WIS < 12)";
        container.appendChild(div);
      }
    }

    function updateUI() {
      // Stats
      document.getElementById("stat-str").innerText = player.str;
      document.getElementById("stat-dex").innerText = player.dex;
      document.getElementById("stat-con").innerText = player.con;
      document.getElementById("stat-wis").innerText = player.wis;

      // Dynamic Stats
      document.getElementById("player-hp").innerText = Math.max(0, player.hp);
      document.getElementById("player-max-hp").innerText = player.maxHp;
      document.getElementById("player-mp").innerText = player.mp;
      document.getElementById("player-max-mp").innerText = player.maxMp;

      document.getElementById("count-potion").innerText = player.items.potion;
      document.getElementById("count-fire").innerText = player.items.fire;
      document.getElementById("count-dummy").innerText = player.items.dummy;

      // Monster UI
      document.getElementById("monster-name").innerText = `${monster.name} (Lvl ${monster.level})`;
      document.getElementById("monster-sprite").innerText = monster.sprite;
      const hpPercent = Math.max(0, (monster.hp / monster.maxHp) * 100);
      document.getElementById("monster-hp-bar").style.width = hpPercent + "%";
    }

    function logMessage(msg) {
      const log = document.getElementById("log");
      log.innerText += "\n" + msg;
      log.scrollTop = log.scrollHeight;
    }

    function showMenu(menuId) {
      document.getElementById("main-menu").classList.add("hidden");
      document.getElementById("magic-menu").classList.add("hidden");
      document.getElementById("item-menu").classList.add("hidden");
      document.getElementById("reset-menu").classList.add("hidden");

      document.getElementById(menuId).classList.remove("hidden");
    }

    // --- PLAYER ACTIONS ---

    function handleFight() {
      if (!isPlayerTurn) return;

      // Determine target stat based on equipped weapon
      const isDexWeapon = (player.weapon === "Bow" || player.weapon === "Spear");
      const targetStat = isDexWeapon ? player.dex : player.str;
      const statName = isDexWeapon ? "DEX" : "STR";

      // BLACK HACK RULE: d20 + Enemy Level <= Target Stat
      const baseRoll = rollD20();
      const totalRoll = baseRoll + monster.level;
      
      logMessage(`Atk (${player.weapon}): [${baseRoll}+${monster.level}Lvl=${totalRoll}] vs ${statName} (${targetStat})`);

      if (totalRoll <= targetStat) {
        const dmg = rollD8() + 10;
        monster.hp -= dmg;
        logMessage(`HIT! You strike with your ${player.weapon} for ${dmg} DMG!`);
      } else {
        logMessage(`MISS! The ${monster.name}'s speed causes you to miss.`);
      }

      endPlayerTurn();
    }

    function castSpell(spell) {
      if (!isPlayerTurn) return;

      if (player.mp < spell.cost) {
        logMessage("Not enough MP!");
        return;
      }

      player.mp -= spell.cost;
      const dmg = rollD8() + 10;
      monster.hp -= dmg;
      logMessage(`Spells ignore armor! ${spell.name} hits for ${dmg} DMG!`);

      showMenu('main-menu');
      endPlayerTurn();
    }

    function useItem(itemKey) {
      if (!isPlayerTurn) return;

      if (player.items[itemKey] <= 0) {
        logMessage("Out of that item!");
        return;
      }

      player.items[itemKey]--;

      if (itemKey === 'potion') {
        const heal = 30;
        player.hp = Math.min(player.maxHp, player.hp + heal);
        logMessage(`You drank a Potion and restored ${heal} HP!`);
      } else if (itemKey === 'fire') {
        const dmg = rollD8() + 10;
        monster.hp -= dmg;
        logMessage(`Alchemist Fire explodes for ${dmg} flat DMG!`);
      } else if (itemKey === 'dummy') {
        logMessage(`You tossed a Decoy Dummy. ${monster.name} is distracted!`);
      }

      showMenu('main-menu');
      endPlayerTurn();
    }

    // --- TURN CONTROL ---

    function endPlayerTurn() {
      updateUI();

      if (monster.hp <= 0) {
        logMessage(`\nVICTORY! You defeated the ${monster.name}!`);
        showMenu('reset-menu');
        return;
      }

      isPlayerTurn = false;
      setTimeout(monsterTurn, 1000);
    }

    function monsterTurn() {
      if (monster.hp <= 0) return;

      // BLACK HACK RULE: d20 + Enemy Level <= Dexterity
      const baseRoll = rollD20();
      const totalRoll = baseRoll + monster.level;

      logMessage(`Dodge: [${baseRoll}+${monster.level}Lvl=${totalRoll}] vs DEX (${player.dex})`);

      if (totalRoll <= player.dex) {
        logMessage(`DODGE! You cleanly avoid ${monster.name}'s strike!`);
      } else {
        const dmg = rollD8() + 10;
        player.hp -= dmg;
        logMessage(`${monster.name} hits you for ${dmg} DMG!`);
      }

      updateUI();

      if (player.hp <= 0) {
        logMessage(`\nDEFEAT! You were vanquished...`);
        showMenu('reset-menu');
        return;
      }

      isPlayerTurn = true;
    }

    // Launch Game
    window.onload = initGame;
  </script>
</body>
</html>
