<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Retro CRPG Encounter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .game-container {
      width: 100%;
      max-width: 680px;
      background: linear-gradient(180deg, #000080 0%, #000033 100%);
      border: 4px solid #ffffff;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2), inset 0 0 10px rgba(0, 0, 0, 0.8);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Monster Visual Area */
    .screen {
      background-color: #000;
      border: 3px solid #666;
      border-radius: 4px;
      height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .monster-sprite {
      font-size: 64px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    .monster-info {
      text-align: center;
      font-size: 12px;
    }

    .health-bar-container {
      width: 160px;
      height: 12px;
      background-color: #444;
      border: 1px solid #fff;
      margin-top: 6px;
    }

    .health-bar {
      height: 100%;
      background-color: #e74c3c;
      width: 100%;
      transition: width 0.3s ease;
    }

    /* Message Log */
    .log-box {
      background: #000022;
      border: 2px solid #ffffff;
      border-radius: 4px;
      height: 80px;
      padding: 10px;
      font-size: 10px;
      line-height: 1.5;
      overflow-y: auto;
      color: #e0e0e0;
    }

    /* Player Status & Command Grid */
    .bottom-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .panel-box {
      background: #000055;
      border: 2px solid #ffffff;
      border-radius: 4px;
      padding: 12px;
      font-size: 10px;
      line-height: 1.8;
    }

    .menu-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      text-align: left;
      cursor: pointer;
      padding: 4px;
      transition: color 0.1s;
    }

    button:hover {
      color: #f1c40f;
    }

    button:before {
      content: '▶ ';
      opacity: 0;
    }

    button:hover:before {
      opacity: 1;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- Monster Display -->
    <div class="screen">
      <div id="monster-sprite" class="monster-sprite">👾</div>
      <div class="monster-info">
        <div id="monster-name">MONSTER</div>
        <div class="health-bar-container">
          <div id="monster-hp-bar" class="health-bar"></div>
        </div>
      </div>
    </div>

    <!-- Battle Log -->
    <div id="log" class="log-box">A wild creature draws near!</div>

    <!-- Stats and Actions -->
    <div class="bottom-panel">
      <!-- Player Stats -->
      <div class="panel-box">
        <div id="player-name">HERO</div>
        <div id="player-weapon" style="color: #aaa; margin-bottom: 6px;">Equipped: -</div>
        <div>HP: <span id="player-hp">100</span>/<span id="player-max-hp">100</span></div>
        <div>MP: <span id="player-mp">30</span>/<span id="player-max-mp">30</span></div>
      </div>

      <!-- Action Submenus -->
      <div class="panel-box">
        <!-- Root Menu -->
        <div id="main-menu" class="menu-options">
          <button onclick="handleFight()">Fight</button>
          <button onclick="showMenu('magic-menu')">Magic</button>
          <button onclick="showMenu('item-menu')">Item</button>
        </div>

        <!-- Magic Submenu -->
        <div id="magic-menu" class="menu-options hidden">
          <button onclick="castSpell('fireball')">Fireball (8MP)</button>
          <button onclick="castSpell('frost')">Frost (5MP)</button>
          <button onclick="castSpell('bolt')">Bolt (10MP)</button>
          <button onclick="castSpell('grass')">Grass Cutter (6MP)</button>
          <button onclick="showMenu('main-menu')" style="color: #888;">Back</button>
        </div>

        <!-- Item Submenu -->
        <div id="item-menu" class="menu-options hidden">
          <button onclick="useItem('potion')">Potion (<span id="count-potion">1</span>)</button>
          <button onclick="useItem('fire')">Alchemist Fire (<span id="count-fire">1</span>)</button>
          <button onclick="useItem('dummy')">Dummy (<span id="count-dummy">1</span>)</button>
          <button onclick="showMenu('main-menu')" style="color: #888;">Back</button>
        </div>

        <!-- Reset Button (When battle ends) -->
        <div id="reset-menu" class="menu-options hidden">
          <button onclick="initGame()">New Encounter</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Game Data Templates
    const MONSTERS = [
      { name: "Goblin", hp: 45, maxHp: 45, atk: 8, sprite: "👺", log: "A sneaky Goblin darts forward!" },
      { name: "Skeleton", hp: 65, maxHp: 65, atk: 12, sprite: "💀", log: "A Skeleton rattles its bones!" },
      { name: "Minotaur", hp: 110, maxHp: 110, atk: 18, sprite: "🐂", log: "A mighty Minotaur bellows!" },
      { name: "Slime", hp: 35, maxHp: 35, atk: 5, sprite: "🟢", log: "A bouncy Slime blocks the way!" }
    ];

    const WEAPONS = [
      { name: "Sword", minAtk: 10, maxAtk: 16 },
      { name: "Spear", minAtk: 8, maxAtk: 20 },
      { name: "Axe", minAtk: 5, maxAtk: 24 },
      { name: "Bow", minAtk: 12, maxAtk: 14 }
    ];

    // State Variables
    let player, monster, isPlayerTurn;

    function initGame() {
      // 1. Randomize Player Setup
      const weapon = WEAPONS[Math.floor(Math.random() * WEAPONS.length)];
      player = {
        hp: 100,
        maxHp: 100,
        mp: 30,
        maxMp: 30,
        weapon: weapon,
        items: { potion: 1, fire: 1, dummy: 1 }
      };

      // 2. Randomize Encounter
      const template = MONSTERS[Math.floor(Math.random() * MONSTERS.length)];
      monster = { ...template };

      isPlayerTurn = true;

      // 3. UI Sync
      document.getElementById("log").innerText = monster.log;
      document.getElementById("player-weapon").innerText = `Equipped: ${player.weapon.name}`;
      
      showMenu('main-menu');
      updateUI();
    }

    function updateUI() {
      // Player UI
      document.getElementById("player-hp").innerText = Math.max(0, player.hp);
      document.getElementById("player-max-hp").innerText = player.maxHp;
      document.getElementById("player-mp").innerText = player.mp;
      document.getElementById("player-max-mp").innerText = player.maxMp;

      document.getElementById("count-potion").innerText = player.items.potion;
      document.getElementById("count-fire").innerText = player.items.fire;
      document.getElementById("count-dummy").innerText = player.items.dummy;

      // Monster UI
      document.getElementById("monster-name").innerText = monster.name;
      document.getElementById("monster-sprite").innerText = monster.sprite;
      const hpPercent = Math.max(0, (monster.hp / monster.maxHp) * 100);
      document.getElementById("monster-hp-bar").style.width = hpPercent + "%";
    }

    function logMessage(msg) {
      const log = document.getElementById("log");
      log.innerText += "\n" + msg;
      log.scrollTop = log.scrollHeight;
    }

    function showMenu(menuId) {
      document.getElementById("main-menu").classList.add("hidden");
      document.getElementById("magic-menu").classList.add("hidden");
      document.getElementById("item-menu").classList.add("hidden");
      document.getElementById("reset-menu").classList.add("hidden");

      document.getElementById(menuId).classList.remove("hidden");
    }

    // --- PLAYER ACTIONS ---

    function handleFight() {
      if (!isPlayerTurn) return;
      const range = player.weapon.maxAtk - player.weapon.minAtk;
      const dmg = Math.floor(Math.random() * range) + player.weapon.minAtk;

      monster.hp -= dmg;
      logMessage(`You strike with your ${player.weapon.name} for ${dmg} DMG!`);
      
      endPlayerTurn();
    }

    function castSpell(spell) {
      if (!isPlayerTurn) return;

      const spells = {
        fireball: { name: "Fireball", cost: 8, dmg: 22 },
        frost: { name: "Frost", cost: 5, dmg: 14 },
        bolt: { name: "Bolt", cost: 10, dmg: 28 },
        grass: { name: "Grass Cutter", cost: 6, dmg: 18 }
      };

      const selected = spells[spell];

      if (player.mp < selected.cost) {
        logMessage("Not enough MP!");
        return;
      }

      player.mp -= selected.cost;
      monster.hp -= selected.dmg;
      logMessage(`You cast ${selected.name} for ${selected.dmg} DMG!`);

      showMenu('main-menu');
      endPlayerTurn();
    }

    function useItem(itemKey) {
      if (!isPlayerTurn) return;

      if (player.items[itemKey] <= 0) {
        logMessage("Out of that item!");
        return;
      }

      player.items[itemKey]--;

      if (itemKey === 'potion') {
        const heal = 40;
        player.hp = Math.min(player.maxHp, player.hp + heal);
        logMessage(`You drank a Potion and restored ${heal} HP!`);
      } else if (itemKey === 'fire') {
        const dmg = 25;
        monster.hp -= dmg;
        logMessage(`You threw Alchemist's Fire for ${dmg} flat DMG!`);
      } else if (itemKey === 'dummy') {
        logMessage(`You tossed a Decoy Dummy. ${monster.name} looks confused!`);
      }

      showMenu('main-menu');
      endPlayerTurn();
    }

    // --- TURN CONTROL ---

    function endPlayerTurn() {
      updateUI();

      if (monster.hp <= 0) {
        logMessage(`\nVICTORY! You defeated the ${monster.name}!`);
        showMenu('reset-menu');
        return;
      }

      isPlayerTurn = false;
      setTimeout(monsterTurn, 1200);
    }

    function monsterTurn() {
      if (monster.hp <= 0) return;

      // Calculate monster attack with slight variance
      const variance = Math.floor(Math.random() * 5) - 2;
      const dmg = Math.max(1, monster.atk + variance);

      player.hp -= dmg;
      logMessage(`${monster.name} attacks you for ${dmg} DMG!`);
      updateUI();

      if (player.hp <= 0) {
        logMessage(`\nDEFEAT! You were vanquished...`);
        showMenu('reset-menu');
        return;
      }

      isPlayerTurn = true;
    }

    // Launch Game on Load
    window.onload = initGame;
  </script>
</body>
</html>
